<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROFECTUS · Servicios Especializados</title>
<meta name="description" content="Tablero de PROFECTUS: clientes y cotizaciones.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/profectus.css">
<script>
  /* Anti-parpadeo: aplica el tema antes de pintar nada. */
  (function(){
    var t = null;
    try{ t = localStorage.getItem('profectus.tema'); }catch(e){}
    if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<!-- ======================= Pantalla de acceso ======================= -->
<div class="pantalla-login oculto" id="pantallaLogin">
  <div class="lado-marca">
    <img class="logo" src="assets/logo-blanco.png" alt="PROFECTUS — Servicios Especializados">
    <p>Tablero interno: administración de clientes y cotizaciones de servicio.</p>
    <img class="simbolo-fondo" src="assets/simbolo.png" alt="">
  </div>
  <div class="lado-form">
    <form class="form-login" id="formLogin" autocomplete="on">
      <h2 id="loginTitulo">Iniciar sesión</h2>
      <label class="campo oculto" id="campoNombre">Nombre completo
        <input id="loginNombre" autocomplete="name">
      </label>
      <label class="campo">Correo
        <input id="loginCorreo" type="email" autocomplete="username" required>
      </label>
      <label class="campo" id="campoClave">Contraseña
        <input id="loginClave" type="password" autocomplete="current-password">
      </label>
      <div class="error" id="loginError"></div>
      <button class="btn primario" type="submit" id="loginBoton">Entrar</button>
      <div class="enlaces">
        <a id="lnkOlvide">¿Olvidaste tu contraseña?</a>
        <a id="lnkRegistro">Solicitar una cuenta</a>
      </div>
    </form>
  </div>
</div>

<!-- ============================ Tablero ============================ -->
<div id="app" class="oculto">
  <div class="aviso-local oculto" id="avisoLocal">
    Modo local: la información se guarda solo en este navegador. Conecta Firebase en <code>js/config.js</code> para trabajar en equipo.
  </div>
  <header class="barra">
    <div class="marca" data-accion="ir" data-modulo="clientes" title="Inicio">
      <img src="assets/logo-blanco.png" alt="PROFECTUS">
    </div>
    <nav id="nav"></nav>
    <div class="usuario">
      <span class="nombre" id="usuarioNombre"></span>
      <span class="chip-rol" id="usuarioRol"></span>
      <button class="icono-btn" id="btnTema" type="button" title="Cambiar tema" aria-label="Cambiar tema"></button>
      <button class="icono-btn oculto" id="btnSalir" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>
  <main id="vista"></main>
</div>

<!-- Ventana modal genérica -->
<div class="telon" id="telon" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="modal" id="modal">
    <div class="modal-cabeza">
      <h3 id="modalTitulo"></h3>
      <button type="button" class="cerrar" id="modalCerrar" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal-cuerpo" id="modalCuerpo"></div>
    <div class="modal-pie" id="modalPie"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="archivoRestaurar" accept="application/json,.json" style="display:none">
<input type="file" id="archivoLogo" accept="image/*" style="display:none">

<script src="js/config.js"></script>
<script src="js/nube.js"></script>
<script src="js/app.js"></script>
</body>
</html>
