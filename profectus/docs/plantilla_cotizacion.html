<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotización · PROFECTUS</title>
<link rel="icon" href="../assets/icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  PLANTILLA · Cotización de servicio (cliente / costo interno)
  El tablero deja aquí el documento YA RESUELTO en sessionStorage
  ('profectus.documento.cotizacion', ver armarPayloadCotizacion() en
  js/app.js). Esta plantilla solo FORMATEA: no calcula dinero.
-->
<style>
  :root{
    --orange:#FF5A00; --charcoal:#111111; --gray:#6B6B6B; --light:#F2F2F2; --rule:#E0E0E0;
    --display:"Bebas Neue","Arial Narrow",sans-serif; --body:"Montserrat",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#DADADA;font-family:var(--body);color:var(--charcoal);font-size:10px;line-height:1.45}
  .hoja{width:8.5in;min-height:11in;margin:22px auto;background:#fff;padding:.55in .6in .9in;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.15)}
  .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:3px solid var(--orange)}
  .cab img{height:58px}
  .cab .doc{text-align:right}
  .cab .doc .tipo{font-family:var(--display);font-size:30px;letter-spacing:.04em;line-height:1}
  .cab .doc .folio{font-size:13px;font-weight:700;color:var(--orange);margin-top:2px}
  .cab .doc .meta{color:var(--gray);font-size:9px;margin-top:4px}
  .interno{background:var(--charcoal);color:#fff;text-align:center;font-weight:700;letter-spacing:.12em;font-size:10px;padding:6px;margin-top:10px;text-transform:uppercase}
  .interno b{color:var(--orange)}
  .bloques{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .bloque{background:var(--light);border-radius:6px;padding:10px 12px}
  .bloque h4{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--orange);margin-bottom:4px}
  .bloque .fila{display:flex;gap:6px}
  .bloque .k{color:var(--gray);min-width:88px}
  .bloque .v{font-weight:600}
  .cliente-logo{float:right;max-height:38px;max-width:90px}
  table.grid{width:100%;border-collapse:collapse;margin-top:18px}
  table.grid thead th{background:var(--charcoal);color:#fff;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:7px 6px;text-align:center}
  table.grid thead th.izq{text-align:left}
  table.grid tbody td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:center;font-size:9.5px}
  table.grid td.izq{text-align:left}
  table.grid td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.grid td .parte{font-size:8px;color:var(--gray)}
  table.grid tr.grupo td{background:var(--light);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.03em;text-align:left}
  table.grid tr.inst td{font-weight:700;border-top:1.5px solid var(--charcoal)}
  table.grid tr{page-break-inside:avoid}
  .pie-tabla{display:flex;justify-content:space-between;gap:20px;margin-top:14px;page-break-inside:avoid}
  .notas{flex:1;font-size:8.5px;color:var(--gray);white-space:pre-wrap}
  .notas h4{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.06em;color:var(--charcoal);margin-bottom:3px}
  table.totales{border-collapse:collapse;min-width:2.8in}
  table.totales td{padding:5px 10px;font-size:11px}
  table.totales td.l{text-align:right;font-weight:600;color:var(--gray)}
  table.totales td.v{text-align:right;font-variant-numeric:tabular-nums}
  table.totales tr.gran td{background:var(--orange);color:#fff;font-weight:700;font-size:14px}
  table.totales tr.gran td.l{color:#fff}
  .resumen-interno{margin-top:12px;border:1.5px dashed var(--charcoal);padding:8px 12px;font-size:10px;display:flex;gap:24px;page-break-inside:avoid}
  .resumen-interno b{color:var(--orange)}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:46px;page-break-inside:avoid}
  .firmas div{border-top:1px solid var(--charcoal);padding-top:5px;text-align:center;font-size:9px;color:var(--gray)}
  .pie{position:absolute;left:.6in;right:.6in;bottom:.35in;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--rule);padding-top:6px;font-size:8px;color:var(--gray)}
  .pie .marca{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--charcoal)}
  .pie .marca span{color:var(--orange)}
  .aviso-impresion{position:sticky;top:0;z-index:5;background:var(--charcoal);color:#fff;font-size:12.5px;padding:9px 18px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  .aviso-impresion button{font:700 13px var(--body);color:#fff;background:var(--orange);border:0;border-radius:8px;padding:7px 16px;cursor:pointer}
  .aviso-impresion .pista{color:#BDBDBD}
  .error-doc{max-width:520px;margin:80px auto;text-align:center;font-size:15px;color:#7a2c28;background:#fff;padding:30px;border-radius:12px}
  @media print{
    body{background:#fff}
    .hoja{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}
    .pie{position:fixed;left:0;right:0;bottom:0}
    @page{size:letter;margin:.5in .55in .7in}
    .aviso-impresion{display:none}
  }
</style>
</head>
<body>
<div class="aviso-impresion" id="avisoImpresion">
  <button type="button" onclick="window.print()">Guardar como PDF</button>
  <span class="pista">si aparece una impresora, cambia el destino a «Guardar como PDF»</span>
</div>
<div id="doc"></div>
<script>
(function(){
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var d = null;
  try{ d = JSON.parse(sessionStorage.getItem('profectus.documento.cotizacion') || 'null'); }catch(e){}
  var cont = document.getElementById('doc');
  if(!d){
    document.getElementById('avisoImpresion').style.display = 'none';
    cont.innerHTML = '<div class="error-doc">No hay documento que mostrar. Ábrelo desde el tablero con «Vista previa / PDF».</div>';
    return;
  }
  var E = d.empresa || {};
  var interno = d.lado === 'costo';
  document.title = (interno ? 'Costo interno ' : 'Cotización ') + (d.folio || '') + ' · ' + (d.cliente.nombre || '');
  var fila = function(k, v){ return v ? '<div class="fila"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>' : ''; };

  var h = '<div class="hoja">';
  h += '<div class="cab"><img src="../assets/logo-negro.png" alt="PROFECTUS — Servicios Especializados">'
    + '<div class="doc"><div class="tipo">' + (interno ? 'Costo interno de servicio' : 'Cotización de servicio') + '</div>'
    + '<div class="folio">' + esc(d.folio) + '</div>'
    + '<div class="meta">Fecha: ' + esc(d.fecha) + ' · Vigencia: ' + esc(d.vigenciaDias) + ' días (hasta ' + esc(d.vence) + ')</div></div></div>';
  if(interno) h += '<div class="interno">Documento de <b>uso interno</b> · no compartir con el cliente</div>';

  h += '<div class="bloques"><div class="bloque">' + (d.cliente.logo ? '<img class="cliente-logo" src="' + d.cliente.logo + '" alt="">' : '')
    + '<h4>Cliente</h4>' + fila('Cliente', d.cliente.nombre) + fila('Razón social', d.cliente.razonSocial) + fila('RFC', d.cliente.rfc)
    + fila('Atención', d.cliente.contacto) + fila('Teléfono', d.cliente.telefono) + fila('Correo', d.cliente.correo)
    + fila('Sitio', d.sitio.nombre) + fila('Ubicación', d.sitio.direccion) + '</div>'
    + '<div class="bloque"><h4>Servicio</h4>' + fila('Tipo de trabajo', d.tipoTrabajo) + fila('Solicitud', d.solicitud) + fila('Equipo', d.equipo)
    + fila('Orden de compra', d.ordenCompra) + fila('Forma de pago', d.tipoPago) + fila('Entrega', d.tiempoEntrega) + fila('Elaboró', d.realizo) + '</div></div>';

  h += '<table class="grid"><thead><tr><th style="width:38px">#</th><th class="izq">Concepto</th><th style="width:48px">Cant.</th><th style="width:48px">U.M.</th><th style="width:90px">' + (interno ? 'Costo unit.' : 'P. unitario') + '</th><th style="width:96px">Importe</th></tr></thead><tbody>';
  (d.renglones || []).forEach(function(r){
    if(r.nuevoGrupo) h += '<tr class="grupo"><td colspan="6">' + esc(r.seccion) + '</td></tr>';
    h += '<tr><td>' + esc(r.numPart) + '</td><td class="izq">' + esc(r.concepto) + (r.numeroParte ? '<div class="parte">N° parte: ' + esc(r.numeroParte) + '</div>' : '') + '</td>'
      + '<td>' + esc(r.cantidad) + '</td><td>' + esc(r.um) + '</td><td class="n">' + esc(r.precio) + '</td><td class="n">' + esc(r.importe) + '</td></tr>';
  });
  if(d.instalacion){
    h += '<tr class="inst"><td>' + esc(d.instalacion.numPart) + '</td><td class="izq">Instalación / mano de obra' + (d.instalacion.detalle ? '<div class="parte">' + esc(d.instalacion.detalle) + '</div>' : '') + '</td>'
      + '<td>1</td><td>SERV</td><td class="n">' + esc(d.instalacion.importe) + '</td><td class="n">' + esc(d.instalacion.importe) + '</td></tr>';
  }
  h += '</tbody></table>';

  h += '<div class="pie-tabla"><div class="notas">' + (d.notas ? '<h4>Condiciones</h4>' + esc(d.notas) : '') + '</div>'
    + '<table class="totales"><tr><td class="l">Subtotal</td><td class="v">' + esc(d.totales.subtotal) + '</td></tr>'
    + '<tr><td class="l">IVA ' + esc(d.totales.ivaPct) + '%</td><td class="v">' + esc(d.totales.iva) + '</td></tr>'
    + '<tr class="gran"><td class="l">Total</td><td class="v">' + esc(d.totales.total) + '</td></tr></table></div>';
  if(interno && d.interno){
    h += '<div class="resumen-interno"><span>Margen aplicado: <b>' + esc(d.interno.margen) + '</b></span><span>Total al cliente: <b>' + esc(d.interno.totalCliente) + '</b></span><span>Utilidad antes de IVA: <b>' + esc(d.interno.utilidad) + '</b></span></div>';
  }
  if(!interno){
    h += '<div class="firmas"><div>' + esc(d.realizo || 'Elaboró') + '<br>' + esc(E.nombre || 'PROFECTUS') + '</div><div>Aceptación del cliente<br>Nombre, firma y fecha</div></div>';
  }
  var contacto = [E.telefono, E.correo, E.web].filter(Boolean).map(esc).join(' · ');
  h += '<div class="pie"><div>' + esc(E.razonSocial || '') + (E.rfc ? ' · RFC ' + esc(E.rfc) : '') + (E.direccion ? '<br>' + esc(E.direccion) : '') + (contacto ? '<br>' + contacto : '') + '</div>'
    + '<div class="marca"><span>PROFECTUS</span> · ' + esc(E.subtitulo || 'Servicios Especializados') + '</div></div>';
  h += '</div>';
  cont.innerHTML = h;
})();
</script>
</body>
</html>
