<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planes | Panel admin Nutripulso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F3D2E', brandLight: '#A7E071' },
          fontFamily: { sans: ['Montserrat', 'ui-sans-serif', 'system-ui'] },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-700 antialiased">

  <header class="bg-brandDark text-white">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-extrabold">
        <svg viewBox="0 0 48 48" class="h-8 w-8" aria-hidden="true">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#A7E071" /><stop offset="100%" stop-color="#22C55E" />
            </linearGradient>
          </defs>
          <path d="M8 40V8h7l17 22V8h8v32h-7L16 18v22H8z" fill="url(#logoGradient)" />
        </svg>
        Nutripulso <span class="text-green-400 font-semibold">· Admin</span>
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm font-semibold text-white/70">
        <li><a href="admin-dashboard.html" class="hover:text-white">Usuarios</a></li>
        <li><a href="admin-planes.html" class="text-white">Planes</a></li>
        <li><a href="admin-agenda.html" class="hover:text-white">Agenda</a></li>
        <li><a href="admin-recetas.html" class="hover:text-white">Recetas</a></li>
      </ul>
      <div class="flex items-center gap-4 text-sm">
        <span id="nombre-admin" class="hidden sm:inline text-white/70"></span>
        <button id="btn-logout" class="rounded-full bg-white/10 hover:bg-white/20 px-4 py-2 font-semibold transition-colors">
          Cerrar sesión
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900">Planes y precios</h1>
        <p class="mt-1 text-gray-500 text-sm">Estos planes se muestran en la landing y al asignar planes a usuarios.</p>
      </div>
      <button id="btn-nuevo-plan" class="rounded-full bg-green-500 hover:bg-green-400 text-brandDark font-bold px-5 py-2.5 transition-colors">
        + Nuevo plan
      </button>
    </div>

    <div id="lista-planes" class="mt-8 grid md:grid-cols-3 gap-6">
      <p class="text-gray-400">Cargando planes...</p>
    </div>
  </main>

  <!-- Modal crear/editar plan -->
  <div id="modal-plan" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center px-6 z-50">
    <form id="form-plan" class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md space-y-4">
      <h2 class="text-xl font-extrabold text-gray-900" id="modal-titulo">Nuevo plan</h2>
      <input type="hidden" id="plan-id" />
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nombre</label>
        <input type="text" id="plan-nombre" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Precio mensual (USD)</label>
        <input type="number" id="plan-precio" min="0" step="1" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Descripción corta</label>
        <input type="text" id="plan-descripcion" class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Beneficios (uno por línea)</label>
        <textarea id="plan-features" rows="4" class="w-full rounded-xl border border-gray-200 px-4 py-2.5"></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Enlace de pago (Stripe, Mercado Pago, etc.)</label>
        <input type="url" id="plan-enlace-pago" placeholder="https://" class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
        <p class="mt-1 text-xs text-gray-400">Si lo dejas vacío, el botón público dirá "Contactar" en vez de "Pagar ahora".</p>
      </div>
      <label class="flex items-center gap-2 text-sm font-semibold text-gray-700">
        <input type="checkbox" id="plan-destacado" /> Destacar como "Más popular" en la landing
      </label>
      <div class="flex gap-3 pt-2">
        <button type="button" id="btn-cancelar-plan" class="flex-1 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold py-2.5">Cancelar</button>
        <button type="submit" class="flex-1 rounded-xl bg-green-500 hover:bg-green-400 text-brandDark font-bold py-2.5">Guardar</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/admin/planes.js"></script>
</body>
</html>
