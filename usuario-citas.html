<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis citas | Nutripulso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F3D2E', brandLight: '#A7E071' },
          fontFamily: { sans: ['Montserrat', 'ui-sans-serif', 'system-ui'] },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-700 antialiased">

  <header class="bg-white shadow-sm">
    <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-extrabold text-brandDark">
        <svg viewBox="0 0 48 48" class="h-8 w-8" aria-hidden="true">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0F3D2E" /><stop offset="100%" stop-color="#22C55E" />
            </linearGradient>
          </defs>
          <path d="M8 40V8h7l17 22V8h8v32h-7L16 18v22H8z" fill="url(#logoGradient)" />
        </svg>
        Nutripulso
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-500">
        <li><a href="usuario-dashboard.html" class="hover:text-brandDark">Mi plan</a></li>
        <li data-modulo="agenda"><a href="usuario-citas.html" class="text-brandDark">Mis citas</a></li>
        <li data-modulo="historias"><a href="usuario-historia.html" class="hover:text-brandDark">Mi historia clínica</a></li>
        <li><a href="usuario-perfil.html" class="hover:text-brandDark">Mi perfil</a></li>
      </ul>
      <div class="flex items-center gap-4 text-sm">
        <span id="nombre-usuario" class="hidden sm:inline text-gray-400"></span>
        <button id="btn-logout" class="rounded-full bg-gray-100 hover:bg-gray-200 px-4 py-2 font-semibold transition-colors">
          Cerrar sesión
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 grid md:grid-cols-3 gap-8">
    <form id="form-cita" class="md:col-span-1 bg-white rounded-3xl shadow-lg p-6 space-y-4 h-fit">
      <h2 class="font-bold text-gray-900">Agendar nueva cita</h2>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Fecha</label>
        <input type="date" id="cita-fecha" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Hora</label>
        <input type="time" id="cita-hora" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Motivo</label>
        <textarea id="cita-motivo" rows="3" class="w-full rounded-xl border border-gray-200 px-4 py-2.5"></textarea>
      </div>
      <button type="submit" class="w-full rounded-xl bg-green-500 hover:bg-green-400 text-brandDark font-bold py-2.5 transition-colors">
        Agendar
      </button>
      <p id="cita-mensaje" class="hidden text-sm font-medium text-brandDark text-center"></p>
    </form>

    <div class="md:col-span-2">
      <h2 class="font-bold text-gray-900 mb-4">Historial de citas</h2>
      <div id="lista-citas" class="space-y-3">
        <p class="text-gray-400">Cargando tus citas...</p>
      </div>
    </div>
  </main>

  <script type="module" src="js/usuario/citas.js"></script>
</body>
</html>
