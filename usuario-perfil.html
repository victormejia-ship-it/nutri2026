<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil | Nutripulso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F3D2E', brandLight: '#A7E071' },
          fontFamily: { sans: ['Montserrat', 'ui-sans-serif', 'system-ui'] },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-700 antialiased">

  <header class="bg-white shadow-sm">
    <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-extrabold text-brandDark">
        <svg viewBox="0 0 48 48" class="h-8 w-8" aria-hidden="true">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0F3D2E" /><stop offset="100%" stop-color="#22C55E" />
            </linearGradient>
          </defs>
          <path d="M8 40V8h7l17 22V8h8v32h-7L16 18v22H8z" fill="url(#logoGradient)" />
        </svg>
        Nutripulso
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-500">
        <li><a href="usuario-dashboard.html" class="hover:text-brandDark">Mi plan</a></li>
        <li><a href="usuario-citas.html" class="hover:text-brandDark">Mis citas</a></li>
        <li><a href="usuario-perfil.html" class="text-brandDark">Mi perfil</a></li>
      </ul>
      <div class="flex items-center gap-4 text-sm">
        <span id="nombre-usuario" class="hidden sm:inline text-gray-400"></span>
        <button id="btn-logout" class="rounded-full bg-gray-100 hover:bg-gray-200 px-4 py-2 font-semibold transition-colors">
          Cerrar sesión
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-extrabold text-gray-900">Mi perfil</h1>
    <p class="mt-1 text-gray-500 text-sm">Actualiza tus datos personales.</p>

    <form id="form-perfil" class="mt-8 bg-white rounded-3xl shadow-lg p-8 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nombre completo</label>
        <input type="text" id="perfil-nombre" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Correo electrónico</label>
        <input type="email" id="perfil-email" disabled class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-gray-400" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Teléfono</label>
        <input type="tel" id="perfil-telefono" class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Objetivo</label>
        <input type="text" id="perfil-objetivo" placeholder="Bajar de peso, ganar músculo, más energía..." class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>

      <p id="perfil-mensaje" class="hidden text-sm font-medium"></p>

      <button type="submit" class="w-full rounded-xl bg-green-500 hover:bg-green-400 text-brandDark font-bold py-3 transition-colors">
        Guardar cambios
      </button>
    </form>

    <form id="form-password" class="mt-6 bg-white rounded-3xl shadow-lg p-8 space-y-4">
      <h2 class="font-bold text-gray-900">Cambiar contraseña</h2>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nueva contraseña</label>
        <input type="password" id="password-nueva" minlength="6" required class="w-full rounded-xl border border-gray-200 px-4 py-2.5" />
      </div>
      <p id="password-mensaje" class="hidden text-sm font-medium"></p>
      <button type="submit" class="w-full rounded-xl border-2 border-brandDark text-brandDark font-bold py-3 transition-colors hover:bg-brandLight/20">
        Actualizar contraseña
      </button>
    </form>
  </main>

  <script type="module" src="js/usuario/perfil.js"></script>
</body>
</html>
