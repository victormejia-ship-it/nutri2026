<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | Nutripulso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F3D2E', brandLight: '#A7E071' },
          fontFamily: { sans: ['Montserrat', 'ui-sans-serif', 'system-ui'] },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-brandDark min-h-screen flex items-center justify-center px-6 py-12">

  <div class="w-full max-w-md">
    <a href="index.html" class="flex items-center justify-center gap-2.5 text-xl font-extrabold text-white mb-8">
      <svg viewBox="0 0 48 48" class="h-9 w-9" aria-hidden="true">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A7E071" />
            <stop offset="100%" stop-color="#22C55E" />
          </linearGradient>
        </defs>
        <path d="M8 40V8h7l17 22V8h8v32h-7L16 18v22H8z" fill="url(#logoGradient)" />
      </svg>
      Nutripulso
    </a>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <h1 class="text-2xl font-extrabold text-gray-900">Crea tu cuenta</h1>
      <p class="mt-2 text-sm text-gray-500">Empieza tu plan de nutrición personalizado hoy.</p>

      <form id="form-registro" class="mt-6 space-y-4">
        <div>
          <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-1.5">Nombre completo</label>
          <input type="text" id="nombre" required autocomplete="name"
            class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email"
            class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Contraseña</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password"
            class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label for="password2" class="block text-sm font-semibold text-gray-700 mb-1.5">Confirmar contraseña</label>
          <input type="password" id="password2" required minlength="6" autocomplete="new-password"
            class="w-full rounded-xl border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>

        <p id="form-error" class="hidden text-sm font-medium text-red-600"></p>

        <button type="submit" id="btn-submit"
          class="w-full inline-flex items-center justify-center rounded-xl bg-green-500 hover:bg-green-400 text-brandDark font-bold px-6 py-3 transition-colors">
          Crear cuenta
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        ¿Ya tienes cuenta?
        <a href="login.html" class="font-semibold text-brandDark hover:underline">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
